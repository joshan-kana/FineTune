# FineTune inherits a large upstream Swift codebase whose existing style is
# intentionally broader than SwiftLint's strict defaults. Keep lint useful for
# actionable warnings without making legacy style rules block the build.
included:
  - FineTune
  - FineTuneTests
  - FineTuneUITests

disabled_rules:
  - cyclomatic_complexity
  - file_length
  - force_cast
  - function_body_length
  - function_parameter_count
  - identifier_name
  - large_tuple
  - line_length
  - shorthand_operator
  - type_body_length
