name: Upstream synchronization

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Prepare one synchronization PR
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/workflow-logic.sh
          git remote add upstream https://github.com/ronitsingh10/FineTune.git
          git fetch origin main
          git fetch upstream main

          delta_count="$(upstream_delta_count origin/main upstream/main)"
          echo "upstream commits not in fork: $delta_count"
          if [[ "$delta_count" == 0 ]]; then
            echo "no_op=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -C automation/upstream-sync origin/main
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            summary="upstream=$(git rev-parse upstream/main), fork=$(git rev-parse origin/main)"
            issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Upstream sync requires manual resolution" in:title' --json number --jq '.[0].number // empty')"
            if [[ -z "$issue_number" ]]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title 'Upstream sync requires manual resolution' \
                --body "The scheduled upstream merge conflicted. $summary"
            fi
            exit 1
          fi

          git push --force-with-lease origin HEAD:automation/upstream-sync
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head automation/upstream-sync --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head automation/upstream-sync \
              --title 'chore: synchronize upstream/main' \
              --body 'Automated upstream synchronization. Attribution and fork-specific changes remain reviewable in this PR.' \
              --json number --jq .number)"
          fi
          expected_head="$(git rev-parse HEAD)"
          actual_head="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          workflow_merge_guard "$expected_head" "$actual_head" success
          {
            echo "no_op=false"
            echo "pr_number=$pr_number"
            echo "head=$expected_head"
          } >> "$GITHUB_OUTPUT"
      - name: Trigger required CI explicitly
        if: steps.sync.outputs.no_op == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref automation/upstream-sync
      - name: Enable guarded merge commit
        if: steps.sync.outputs.no_op == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.sync.outputs.pr_number }}" --repo "$GITHUB_REPOSITORY" --auto --merge --delete-branch
