name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
      - name: Record runner tools
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          nix --version
      - name: Read-only lint
        run: nix run .#lint
      - name: Flake evaluation
        run: nix flake check --impure --option sandbox false --no-build
      - name: Build and test
        run: nix run .#check
      - name: Collect test-host crash reports
        if: failure()
        run: |
          mkdir -p .build/Diagnostics/CrashReports
          find "$HOME/Library/Logs/DiagnosticReports" \
               "/Library/Logs/DiagnosticReports" \
            -maxdepth 1 \
            -type f \
            \( -name 'FineTune*.ips' -o -name 'FineTune*.crash' \) \
            -mmin -20 \
            -exec cp -p {} .build/Diagnostics/CrashReports/ \; \
            2>/dev/null || true
      - name: Package smoke test
        run: nix run .#package
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finetune-diagnostics-${{ github.run_id }}
          path: |
            .build/Logs
            .build/Results
            .build/Diagnostics/CrashReports
            dist/build-metadata.json
            dist/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 14
