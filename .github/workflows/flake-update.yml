name: Flake update

on:
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: flake-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Update and validate one lock-file PR
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C automation/flake-update origin/main
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "no_op=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          nix flake check --impure --option sandbox false --no-build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flake.lock
          git commit -m 'chore(nix): update flake inputs'
          git push --force-with-lease origin HEAD:automation/flake-update
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head automation/flake-update --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head automation/flake-update \
              --title 'chore(nix): update flake inputs' \
              --body 'Automated pinned-input update; upstream source synchronization is intentionally separate.' \
              --json number --jq .number)"
          else
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --body 'Automated pinned-input update; upstream source synchronization is intentionally separate.'
          fi
          echo "no_op=false" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Trigger required CI explicitly
        if: steps.update.outputs.no_op == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref automation/flake-update
      - name: Enable guarded auto-merge
        if: steps.update.outputs.no_op == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.update.outputs.pr_number }}" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
