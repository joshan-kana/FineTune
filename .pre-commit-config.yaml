repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: ^scripts/[^/]+$
      - id: nix-flake-check
        name: nix flake check
        entry: nix flake check --impure --option sandbox false
        language: system
        pass_filenames: false
